nodeVersion: 24.20.0
pmOnFail: warn
packages:
  - 'bin'
  - 'ui/*'
  - 'ui/@types/*'
  # LiGo: the Go board and its rules (goban), built into lila's pages (unit 2.1)
  - '../libs/board'
  # LiGo: the scoring service core, KataGo + goban-engine autoscore + goscorer (ADR 0016, unit 4.4)
  - '../services/scoring'
ignoredOptionalDependencies:
  - '@ox*/*-arm-*'
  - '@ox*/*-ia32-*'
  - '@ox*/*-loong64-*'
  - '@ox*/*-mips64el-*'
  - '@ox*/*-ppc64-*'
  - '@ox*/*-riscv64-*'
  - '@ox*/*-s390x-*'
  - '@ox*/*-aix-*'
  - '@ox*/*-android-*'
  - '@ox*/*-freebsd-*'
  - '@ox*/*-openbsd-*'
  - '@ox*/*-openharmony-*'
  - '@ox*/*-netbsd-*'
  - '@ox*/*-sunos-*'
allowBuilds:
  esbuild: true
overrides:
  fast-uri: ^3.1.7
  undici: ^8.10.2
patchedDependencies:
  '@toast-ui/editor@3.2.2': ui/bits/patches/@toast-ui__editor.patch
minimumReleaseAgeExclude:
  - '@lichess-org/*'
  - chessops@0.15.1
  - tsx@4.23.5
