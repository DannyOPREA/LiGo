# Both Go rules engines and their parity (PLAN §6). The server's: libs/go-rules (the adapter over
# strategygames, ADR 0012) replaying every libs/conformance fixture, its property tests and SGF
# tests, formatting, and the strategygames jar pin (unit 1.7). The client's: goban-engine with
# LiGo's settings (libs/board, ADR 0014) replaying the same fixtures, reading back the server's SGF,
# and replaying the server's seeded random games move by move (unit 1.8). Runs when libs/go-rules,
# libs/board or the fixtures change.
name: rules

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rules-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rules: ${{ steps.changed.outputs.rules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # On a pull request the checkout is GitHub's merge commit, whose first parent is the base.
      - id: changed
        run: dev/ci/changed.sh "$BASE" >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}

  rules:
    needs: rules-paths
    if: needs.rules-paths.outputs.rules == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: libs/go-rules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
          cache-dependency-path: |
            libs/go-rules/build.sbt
            libs/go-rules/project/**
      - name: Setup sbt
        uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8
      # The jar is checked after it is downloaded and before any test runs it.
      - name: Resolve dependencies
        run: sbt update
      - name: strategygames jar matches the pinned SHA-256
        run: ./check-pin.sh
      # testFull, not test: sbt 2's test skips tests whose code didn't change, and a fixture change
      # is not a code change. sbt 2's thin client takes one command line, so the two commands go in
      # one quoted argument separated by ';'.
      - name: Check formatting, compile and replay the fixtures
        run: sbt "scalafmtCheckAll; testFull"
      # The client's engine (goban-engine, libs/board, unit 1.8): the same fixtures, then the parity
      # check against what the server just wrote to target/parity/server.json (ParityExportTest).
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: libs/board/package.json
      - name: Setup node and restore pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: libs/board/.node-version
          cache: pnpm
          cache-dependency-path: libs/board/pnpm-lock.yaml
      - name: Install goban-engine
        working-directory: libs/board
        run: pnpm install --frozen-lockfile
      - name: goban-engine's npm dependencies are AGPL-compatible
        working-directory: libs/board
        shell: bash
        run: |
          set -o pipefail
          pnpm licenses list --json | ../../dev/ci/meta_checks.py js-licences
      - name: Client fixtures, SGF read-back and parity with the server
        working-directory: libs/board
        run: pnpm run test:all
