# The server's Go rules: libs/go-rules (the adapter over strategygames, ADR 0012) replaying every
# libs/conformance fixture, its property tests and SGF tests, formatting, and the strategygames jar
# pin. Runs when libs/go-rules or the fixtures change. Unit 1.7.
name: rules

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rules-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rules: ${{ steps.changed.outputs.rules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # On a pull request the checkout is GitHub's merge commit, whose first parent is the base.
      - id: changed
        run: dev/ci/changed.sh "$BASE" >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}

  rules:
    needs: rules-paths
    if: needs.rules-paths.outputs.rules == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: libs/go-rules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
          cache-dependency-path: |
            libs/go-rules/build.sbt
            libs/go-rules/project/**
      - name: Setup sbt
        uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8
      # The jar is checked after it is downloaded and before any test runs it.
      - name: Resolve dependencies
        run: sbt update
      - name: strategygames jar matches the pinned SHA-256
        run: ./check-pin.sh
      # testFull, not test: sbt 2's test skips tests whose code didn't change, and a fixture change
      # is not a code change. sbt 2's thin client takes one command line, so the two commands go in
      # one quoted argument separated by ';'.
      - name: Check formatting, compile and replay the fixtures
        run: sbt "scalafmtCheckAll; testFull"
