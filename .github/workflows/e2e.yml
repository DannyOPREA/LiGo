# The end-to-end demo game (unit 3.20, PLAN §5 row 3.20): the whole stack (lila, lila-ws, Mongo,
# Redis, the scoring worker) started by `dev/ligo up` in native mode, then two browsers play a
# casual 9x9 Fischer game from the lobby to a resignation (unit 3.20) and two 19x19 byo-yomi games
# through the scoring phase, one with a resume (unit 4.12), at desktop and phone sizes
# (lila/tests/e2e-demo), and at phone size a new player solves a puzzle and fails one while the rating
# moves, and every committed puzzle comes back from the server (unit 8.8). Since unit 5.8 it also
# plays the Phase 5 demo: a 5k and a 1d sign up and play a rated handicap game whose rating changes
# must match goratings; a guest plays casual. Since unit 6.10 it plays the Phase 6 demo: one click from
# the lobby to a first move (timed), a rated handicap pool game, a custom game joined from the open
# challenges table and a profile challenge. It takes a cold lila build, so it runs nightly, on
# demand, and on a pull request only while it carries the `e2e` label. Not a required check.
name: e2e

on:
  schedule:
    - cron: '41 2 * * *' # 02:41 UTC
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  demo:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LIGO_MODE: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
          cache-dependency-path: |
            lila/build.sbt
            lila/project/**
            lila-ws/build.sbt
            lila-ws/project/**
            libs/go-rules/build.sbt
            libs/go-rules/project/**
      - name: Setup sbt
        uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: lila/package.json
      - name: Setup node and restore pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: lila/.node-version
          cache: pnpm
          cache-dependency-path: lila/pnpm-lock.yaml
      # Frozen pnpm install and sbt update for lila, lila-ws and libs/go-rules.
      - name: Dependencies
        run: dev/ligo deps
      # The strategygames jar is checked after it is downloaded and before anything runs it, as the
      # lila and rules jobs do.
      - name: strategygames jar matches the pinned SHA-256
        run: libs/go-rules/check-pin.sh
      - name: Install Chromium for Playwright
        working-directory: lila
        run: pnpm exec playwright install --with-deps chromium
      # Mongo and Redis in docker, the ui build, lila-ws, lila and the scoring worker (without
      # KataGo: its proposals mark nothing dead, which the Phase 4 games allow for), then waits for
      # lila to answer.
      - name: Start the stack
        run: dev/ligo up
      - name: Smoke test and the demo game
        working-directory: lila
        run: |
          pnpm exec tsc -p tests/e2e-demo/tsconfig.json
          ../dev/ligo e2e demo
      - name: Stop the stack
        if: always()
        run: dev/ligo down || true
      - name: Upload the report and the server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-demo
          path: |
            lila/tests/e2e-demo/playwright-report/
            lila/tests/e2e-demo/test-results/
            .ligo/logs/
          retention-days: 7
